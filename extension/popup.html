<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn Email Collector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Email Collector</h1>
        <p id="conn" class="muted">Not connected</p>
      </div>
      <div class="head-right">
        <span id="state" class="pill">Idle</span>
        <button id="openDashboard" class="secondary" title="Open the dashboard in a new tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6" /><path d="M10 14 21 3" /><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
          Dashboard
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="run" class="active">Search</button>
      <button role="tab" data-tab="found">Found <span id="foundCount"></span></button>
      <button role="tab" data-tab="setup">Setup</button>
    </nav>

    <section id="tab-run" class="panel">
      <label for="keywords">Search keywords <small>one search per line</small></label>
      <textarea id="keywords" rows="3" placeholder="hiring react developer&#10;frontend developer send cv"></textarea>

      <label for="exclude">Skip posts that mention <small>comma separated</small></label>
      <input id="exclude" placeholder="python, java, .net" />

      <label for="mustHave">Only keep posts that mention <small>optional</small></label>
      <input id="mustHave" placeholder="react, next.js" />

      <div class="row">
        <div>
          <label for="timeline">Posted</label>
          <select id="timeline">
            <option value="past-24h">Past 24 hours</option>
            <option value="past-week" selected>Past week</option>
            <option value="past-month">Past month</option>
            <option value="any">Any time</option>
          </select>
        </div>
        <div>
          <label for="maxPosts">Max posts / search</label>
          <input id="maxPosts" type="number" min="10" value="300" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="scrollDelay">Scroll delay (ms)</label>
          <input id="scrollDelay" type="number" min="800" step="100" value="2500" />
        </div>
        <div>
          <label for="maxMinutes">Stop after (min)</label>
          <input id="maxMinutes" type="number" min="1" value="30" />
        </div>
      </div>

      <div class="actions">
        <button id="start" class="primary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3" /></svg>
          Start
        </button>
        <button id="stop" class="secondary" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="5" y="5" rx="2" /></svg>
          Stop
        </button>
      </div>

      <dl class="stats">
        <div><dt>Scanned</dt><dd id="sScanned">0</dd></div>
        <div><dt>Skipped</dt><dd id="sSkipped">0</dd></div>
        <div><dt>New emails</dt><dd id="sNew">0</dd></div>
        <div><dt>Saved</dt><dd id="sSaved">0</dd></div>
      </dl>
      <p id="status" class="muted small"></p>
      <p id="syncError" class="error small"></p>
    </section>

    <section id="tab-found" class="panel" hidden>
      <div class="actions">
        <button id="exportCsv" class="secondary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg>
          Export CSV
        </button>
        <button id="resync" class="secondary">Sync now</button>
        <button id="clear" class="ghost">Clear list</button>
      </div>
      <p id="pendingInfo" class="muted small"></p>
      <ul id="foundList"></ul>
    </section>

    <section id="tab-setup" class="panel" hidden>
      <label for="dashboardUrl">Dashboard URL</label>
      <input id="dashboardUrl" placeholder="https://your-dashboard.com" />
      <label for="apiKey">API key <small>from the dashboard Extension page</small></label>
      <input id="apiKey" placeholder="jo_..." />
      <div class="actions">
        <button id="saveSetup" class="primary">Save and test</button>
      </div>
      <p id="setupMsg" class="small"></p>
      <p class="muted small">
        Keep runs modest. Automated scrolling is against LinkedIn's terms, so use your own account at a human pace.
      </p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
